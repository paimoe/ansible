# Based on the Immich release Compose example; keep image versions in sync when upgrading.
name: immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "192.168.0.174:10001:2283"
    depends_on:
      - redis
      - database
    networks:
      - frontend
      - backend
    healthcheck:
      disable: false

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    restart: unless-stopped
    env_file: .env
    volumes:
      - model-cache:/cache
    networks:
      - frontend
    healthcheck:
      disable: false

  redis:
    image: docker.io/valkey/valkey:9@sha256:70739f85ad2ee01a726a965584a0f94895f01b0c60b3cc8b0aeef11eaa6888cf
    restart: unless-stopped
    networks:
      - backend
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1

  database:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    # Host-only access for maintenance/SSH tunnelling; never expose Postgres to the LAN.
    ports:
      - "127.0.0.1:10000:5432"
    networks:
      - backend
    healthcheck:
      disable: false

volumes:
  model-cache:

networks:
  frontend:
  backend:
    internal: true
