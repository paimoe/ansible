- name: Configure homelab
  hosts: homelab
  become: true

  tasks:
    - name: Verify privilege escalation
      ansible.builtin.command: whoami
      register: whoami
      changed_when: false

    - name: Show effective user
      ansible.builtin.debug:
        var: whoami.stdout

    - name: Configure SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-homelab.conf
        content: |
          PubkeyAuthentication yes
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        owner: root
        group: root
        mode: "0644"
        validate: "/usr/sbin/sshd -t -f %s"

    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    - name: Allow SSH from home LAN
      community.general.ufw:
        rule: allow
        src: 192.168.0.0/24
        port: "22"
        proto: tcp

    - name: Allow Glance dashboard from home LAN
      community.general.ufw:
        rule: allow
        src: 192.168.0.0/24
        port: "3000"
        proto: tcp

    - name: Allow Immich from home LAN
      community.general.ufw:
        rule: allow
        src: 192.168.0.0/24
        port: "10001"
        proto: tcp

    - name: Allow Trilium from home LAN
      community.general.ufw:
        rule: allow
        src: 192.168.0.0/24
        port: "11000"
        proto: tcp

    - name: Default deny incoming
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Default allow outgoing
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    ### DOCKER ###
    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          resolute stable
        filename: docker
        state: present

    - name: Install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Deploy Immich
      ansible.builtin.import_tasks: tasks/immich.yml

    - name: Deploy Pi-hole
      ansible.builtin.import_tasks: tasks/pihole.yml

    - name: Deploy Glance dashboard
      ansible.builtin.import_tasks: tasks/dashboard.yml

    - name: Deploy Trilium
      ansible.builtin.import_tasks: tasks/trilium.yml

    - name: Enable boot notification
      ansible.builtin.import_tasks: tasks/boot.yml
