- name: Create Pi-hole directory
  ansible.builtin.file:
    path: /srv/pihole
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create Pi-hole data directory
  ansible.builtin.file:
    path: /srv/pihole/etc-pihole
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Pi-hole compose file
  ansible.builtin.copy:
    dest: /srv/pihole/compose.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      services:
        pihole:
          container_name: pihole
          image: pihole/pihole:latest
          restart: unless-stopped

          ports:
            - "{{ ansible_host }}:{{ pihole.DNS_PORT }}:53/tcp"
            - "{{ ansible_host }}:{{ pihole.DNS_PORT }}:53/udp"
            - "{{ ansible_host }}:{{ pihole.PUBLIC_PORT }}:80/tcp"

          environment:
            TZ: Australia/Perth
            FTLCONF_webserver_domain: pihole.home.arpa
            FTLCONF_dns_listeningMode: ALL
            FTLCONF_dns_upstreams: "1.1.1.1;1.0.0.1"
            FTLCONF_dns_hosts: |
              {{ ansible_host }} homelab.home.arpa
              {{ ansible_host }} pihole.home.arpa
              {{ ansible_host }} glance.home.arpa
              {{ ansible_host }} immich.home.arpa
              {{ ansible_host }} trilium.home.arpa
              {{ ansible_host }} karakeep.home.arpa

          volumes:
            - /srv/pihole/etc-pihole:/etc/pihole

          networks:
            default:
              aliases:
                - pihole.home.arpa

- name: Start Pi-hole
  community.docker.docker_compose_v2:
    project_src: /srv/pihole
    state: present
